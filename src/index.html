<!doctype html><html lang=en translate=no><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Asolaria ASI OS</title>
<style>
:root{--ac:#43e8d8;--ac2:#a78bfa;--am:#ffb454;--gn:#5ce0a0;--rd:#ff6b6b;
 --bg:#060a14;--glass:rgba(16,22,38,.78);--glass2:rgba(20,27,46,.97);--win:#0d1322;--winhd:#121a2d;--ln:rgba(140,170,220,.16);--ln2:rgba(140,170,220,.28);
 --tx:#e6edf9;--tx2:#9aa8c3;--dim:#64738f;--sh:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);--ico:56px;--r:12px;
 --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace}
body.light{--bg:#dfe7f3;--glass:rgba(250,252,255,.8);--glass2:rgba(255,255,255,.95);--win:#f7f9fc;--winhd:#eef2f8;--ln:rgba(40,60,100,.14);--ln2:rgba(40,60,100,.24);--tx:#16203a;--tx2:#46557a;--dim:#7a88a6;--sh:0 18px 50px rgba(30,50,90,.25),0 2px 8px rgba(30,50,90,.15)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:13.5px/1.45 var(--ui);user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--tx)}
::selection{background:rgba(67,232,216,.35)}
/* ---------- wallpaper ---------- */
#wall{position:fixed;inset:0;z-index:0;overflow:hidden}
#wall.cube{background:radial-gradient(1200px 700px at 78% 8%,rgba(64,90,200,.38),transparent 60%),radial-gradient(900px 600px at 10% 95%,rgba(150,80,220,.30),transparent 60%),radial-gradient(700px 500px at 55% 60%,rgba(40,200,190,.12),transparent 70%),linear-gradient(160deg,#081022,#05070f 60%,#0a0718)}
#wall.aurora{background:radial-gradient(1000px 500px at 20% 15%,rgba(60,230,200,.35),transparent 60%),radial-gradient(1000px 600px at 85% 30%,rgba(140,90,250,.40),transparent 60%),radial-gradient(900px 500px at 50% 100%,rgba(255,170,80,.22),transparent 60%),linear-gradient(180deg,#071024,#0b0820)}
#wall.dusk{background:radial-gradient(1100px 600px at 50% 110%,rgba(255,140,90,.45),transparent 60%),radial-gradient(900px 500px at 30% 0%,rgba(90,70,200,.45),transparent 60%),linear-gradient(180deg,#120a2a,#1d0f2a 55%,#3a1a2a)}
#wall.plain{background:linear-gradient(160deg,#0c1426,#070a14)}
body.light #wall.cube{background:radial-gradient(1100px 700px at 78% 8%,rgba(120,150,255,.45),transparent 60%),radial-gradient(900px 600px at 10% 95%,rgba(190,140,255,.35),transparent 60%),linear-gradient(160deg,#eef3fb,#d7e1f1)}
body.light #wall.aurora{background:radial-gradient(1000px 500px at 20% 15%,rgba(60,230,200,.35),transparent 60%),radial-gradient(1000px 600px at 85% 30%,rgba(140,90,250,.35),transparent 60%),linear-gradient(180deg,#c9d8ef,#b8c4e6)}
body.light #wall.dusk{background:radial-gradient(1100px 600px at 50% 110%,rgba(255,150,100,.55),transparent 60%),linear-gradient(180deg,#a9b3e0,#d9b3c4)}
body.light #wall.plain{background:linear-gradient(160deg,#eef3fb,#d5deee)}
#wall svg.hero{position:absolute;right:7%;top:50%;transform:translateY(-58%);width:min(38vw,520px);height:auto;opacity:.62;filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
#wall .mark{position:absolute;right:6%;bottom:72px;text-align:right;color:rgba(230,240,255,.55);letter-spacing:.38em;font:600 13px var(--ui)}
#wall .mark b{display:block;font-size:30px;letter-spacing:.32em;color:rgba(235,245,255,.82);font-weight:300}
body.light #wall .mark{color:rgba(30,40,70,.5)}body.light #wall .mark b{color:rgba(30,40,70,.7)}
/* ---------- desktop icons ---------- */
#desk{position:fixed;left:0;top:0;right:0;bottom:52px;z-index:1;padding:14px 10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,calc(var(--ico) + 44px));grid-auto-columns:calc(var(--ico) + 44px);gap:4px 6px;align-content:start}
.dico{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px 5px;border-radius:10px;border:1px solid transparent;cursor:default;outline:none}
.dico svg{width:var(--ico);height:var(--ico);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));transition:transform .12s}
.dico:hover{background:rgba(255,255,255,.07)}.dico:hover svg{transform:translateY(-1px)}
.dico.sel{background:rgba(67,232,216,.16);border-color:rgba(67,232,216,.45)}
body.light .dico span{background:rgba(15,25,50,.42);border-radius:6px;padding:0 6px}
.dico span{font-size:12px;color:#fff;text-align:center;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.5);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- windows ---------- */
#wins{position:fixed;inset:0 0 52px 0;z-index:2;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--ln2);border-radius:var(--r);box-shadow:var(--sh);pointer-events:auto;min-width:300px;min-height:180px;overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.win.inactive{box-shadow:0 10px 30px rgba(0,0,0,.35)}.win.inactive .tb{opacity:.78}
.win.max{border-radius:0;border-width:0}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:9px;height:38px;padding:0 4px 0 12px;background:var(--winhd);border-bottom:1px solid var(--ln);flex:none;cursor:default}
.tb svg{width:18px;height:18px;flex:none}
.tb .tt{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .tt small{font-weight:400;color:var(--dim);margin-left:6px}
.tb .wb{width:40px;height:30px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--tx2);cursor:pointer}
.tb .wb:hover{background:rgba(140,170,220,.14);color:var(--tx)}.tb .wb.x:hover{background:#e0464f;color:#fff}
.tb .wb svg{width:12px;height:12px}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;user-select:text}
.rz{position:absolute;z-index:3}.rz.n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}.rz.s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rz.e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}.rz.w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rz.ne{right:-3px;top:-3px;width:12px;height:12px;cursor:nesw-resize}.rz.nw{left:-3px;top:-3px;width:12px;height:12px;cursor:nwse-resize}
.rz.se{right:-3px;bottom:-3px;width:14px;height:14px;cursor:nwse-resize}.rz.sw{left:-3px;bottom:-3px;width:12px;height:12px;cursor:nesw-resize}
.win.max .rz{display:none}
#ghost{position:fixed;z-index:1;border-radius:12px;background:rgba(67,232,216,.12);border:2px solid rgba(67,232,216,.6);pointer-events:none;display:none;transition:all .1s}
#shield{position:fixed;inset:0;z-index:9;display:none}
/* ---------- taskbar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:5;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--ln)}
#startb{height:40px;padding:0 12px 0 8px;border:0;border-radius:9px;background:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;letter-spacing:.06em}
#startb svg{width:28px;height:28px}#startb:hover,#startb.on{background:rgba(140,170,220,.14)}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.task{height:40px;max-width:200px;min-width:44px;display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;border:0;border-radius:9px;background:none;cursor:pointer;position:relative;white-space:nowrap}
.task svg{width:22px;height:22px;flex:none}.task span{overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.task:hover{background:rgba(140,170,220,.12)}
.task.on{background:rgba(140,170,220,.18)}
.task::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:3px;background:var(--dim)}
.task.on::after{width:18px;background:var(--ac)}
#tray{display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;height:40px}
.svc{display:flex;gap:5px;align-items:center;padding:6px 9px;border-radius:9px;cursor:pointer}.svc:hover{background:rgba(140,170,220,.12)}
.svc i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.svc i.up{background:var(--gn);box-shadow:0 0 7px var(--gn)}.svc i.down{background:var(--rd);box-shadow:0 0 7px var(--rd)}.svc i.np,.svc i.slow{background:var(--am)}
.e0{font:600 10.5px var(--mono);color:var(--gn);border:1px solid rgba(92,224,160,.45);border-radius:6px;padding:2px 6px;letter-spacing:.05em}
#clock{text-align:right;line-height:1.25;font-size:12px;padding:4px 8px;border-radius:9px;cursor:default;font-variant-numeric:tabular-nums}
#clock:hover{background:rgba(140,170,220,.12)}#clock small{color:var(--tx2);display:block;font-size:11px}
/* ---------- start menu ---------- */
#start{position:fixed;left:10px;bottom:60px;z-index:8;width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 80px);display:none;flex-direction:column;background:var(--glass2);backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--ln2);border-radius:16px;box-shadow:var(--sh);overflow:hidden;animation:rise .16s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#start.on{display:flex}
#start .srch{margin:18px 18px 8px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--ln2);border-radius:22px;padding:8px 14px}
body.light #start .srch{background:rgba(255,255,255,.7)}
#start .srch input{flex:1;border:0;background:none;outline:none;font-size:14px}
#start h4{margin:10px 24px 6px;font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:.04em}
#sapps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:4px 16px 12px;overflow:auto}
.sapp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:center;font-size:12px}
.sapp svg{width:40px;height:40px}.sapp:hover,.sapp.hl{background:rgba(140,170,220,.15)}
.sapp small{display:block;color:var(--dim);font-size:10.5px;margin-top:-3px}
#start .sfoot{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--ln);background:rgba(0,0,0,.12);font-size:12px}
#start .sfoot .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;color:#061018}
#start .sfoot .who{flex:1;line-height:1.25}#start .sfoot .who small{color:var(--dim);font-family:var(--mono)}
/* ---------- menus, toasts ---------- */
.menu{position:fixed;z-index:10;min-width:210px;padding:6px;background:var(--glass2);backdrop-filter:blur(20px);border:1px solid var(--ln2);border-radius:10px;box-shadow:var(--sh);display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:7px 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;font-size:13px}
.menu button:hover{background:rgba(140,170,220,.16)}.menu hr{border:0;border-top:1px solid var(--ln);margin:5px 4px}
.menu button svg{width:16px;height:16px}
#toasts{position:fixed;right:14px;bottom:64px;z-index:11;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--glass2);backdrop-filter:blur(20px);border:1px solid var(--ln2);border-radius:10px;padding:10px 14px;box-shadow:var(--sh);max-width:360px;font-size:12.5px;animation:rise .16s}
.toast b{display:block;margin-bottom:2px}
/* ---------- app content ---------- */
.pad{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.tbtn{height:30px;padding:0 12px;border:1px solid var(--ln2);border-radius:7px;background:rgba(140,170,220,.08);cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--ac);color:var(--ac)}.tbtn.pri{background:var(--ac);color:#04151a;border-color:var(--ac);font-weight:600}.tbtn.pri:hover{filter:brightness(1.1);color:#04151a}
.tool{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ln);background:var(--winhd);flex:none;flex-wrap:wrap}
.field{height:32px;border:1px solid var(--ln2);border-radius:8px;background:rgba(0,0,0,.18);padding:0 10px;outline:none;min-width:0}
body.light .field{background:#fff}.field:focus{border-color:var(--ac)}
.muted{color:var(--dim)}.mono{font-family:var(--mono)}
/* terminal */
.term{flex:1;min-height:0;display:flex;flex-direction:column;background:#0b0f17}
.vt{flex:1;min-height:0;position:relative;overflow:hidden;padding:4px 8px;background:#0b0f17;color:#d5e0f3;font:13px/17px var(--mono);cursor:text;user-select:none}
.vtrows>div{height:17px;white-space:pre;overflow:hidden}
.vt .b{font-weight:700}.vt .d{opacity:.6}.vt .i{font-style:italic}.vt .u{text-decoration:underline}.vt .s{text-decoration:line-through}.vt .h{color:transparent!important}
.vt .cur{outline:1px solid var(--ac);outline-offset:-1px}
.vt.focus .cur{background:var(--ac)!important;color:#06131a!important;outline:0;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{background:transparent;color:inherit}}
.vt.sb{box-shadow:inset 0 0 0 1px rgba(255,180,84,.45)}
.vtin{position:absolute;width:2px;height:17px;opacity:0;border:0;padding:0;margin:0;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:transparent;z-index:-1}
.tstat{font:11px var(--mono);color:#6d7b98;padding:4px 10px;display:flex;justify-content:space-between;gap:10px;background:#090c13;border-top:1px solid rgba(140,170,220,.1);white-space:nowrap;overflow:hidden}
.mbadge{font:700 9.5px var(--mono);padding:1px 6px;border-radius:5px;margin-left:4px;letter-spacing:.06em;vertical-align:1px}
.mbadge.pty{background:rgba(92,224,160,.18);color:var(--gn)}.mbadge.pipe{background:rgba(255,180,84,.18);color:var(--am)}
/* monitor */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--ln);border-radius:12px;padding:14px;background:rgba(140,170,220,.05);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim)}
.tile.up::before{background:var(--gn)}.tile.down::before{background:var(--rd)}.tile.np::before,.tile.slow::before{background:var(--am)}
.tile .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}.tile .st{white-space:nowrap;flex:none}
.tile .st{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:20px}
.st.up{background:rgba(92,224,160,.16);color:var(--gn)}.st.down{background:rgba(255,107,107,.16);color:var(--rd)}.st.np,.st.slow{background:rgba(255,180,84,.16);color:var(--am)}
.tile .p{color:var(--dim);font:12px var(--mono);margin-top:2px}.tile .d{margin-top:10px;font-size:12.5px;color:var(--tx2);word-break:break-all}.tile .d b{color:var(--tx)}
/* rows */
table.rows{border-collapse:collapse;width:100%;font-size:12.5px}
table.rows td,table.rows th{padding:6px 8px;border-bottom:1px solid var(--ln);vertical-align:top;text-align:left}
table.rows th{color:var(--tx2);font-weight:600;position:sticky;top:0;background:var(--win)}
.kv{display:inline-block;margin:1px 6px 1px 0;font:12px var(--mono);color:var(--tx2)}.kv b{color:var(--tx);font-weight:500}
.tag{font:600 11px var(--mono);color:var(--ac);white-space:nowrap}
/* files */
.files{flex:1;min-height:0;display:grid;grid-template-columns:minmax(240px,50%) 1fr}
.flist{overflow:auto;border-right:1px solid var(--ln)}
.fent{display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:default;border-radius:0}
.fent:hover{background:rgba(140,170,220,.08)}.fent.sel{background:rgba(67,232,216,.14)}
.fent svg{width:20px;height:20px;flex:none}.fent .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fent .z{color:var(--dim);font:11.5px var(--mono)}
.fview{overflow:auto;padding:12px 14px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;user-select:text}
.crumb{display:flex;gap:2px;align-items:center;flex:1;overflow:hidden}
.crumb button{border:0;background:none;padding:4px 7px;border-radius:6px;cursor:pointer;white-space:nowrap}.crumb button:hover{background:rgba(140,170,220,.14)}
/* recall */
.hit{padding:10px 12px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;background:rgba(140,170,220,.04);cursor:pointer}.hit:hover{border-color:var(--ac)}
.hit .pth{font:12.5px var(--mono);color:var(--ac);word-break:break-all}.hit .m{margin-top:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ln2);border-top-color:var(--ac);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* settings / about */
.set{display:grid;grid-template-columns:150px 1fr;gap:14px 16px;align-items:center;max-width:560px}
.set label{color:var(--tx2)}.set>*:nth-child(even){justify-self:start}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:12.5px}.seg button.on{background:var(--ac);color:#04151a;font-weight:600}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:inline-block;margin-right:6px}.swatch.on{border-color:var(--tx)}
.about{display:flex;gap:22px;align-items:flex-start}.about svg.lg{width:120px;height:120px;flex:none}
.about h2{margin:4px 0 2px;font-weight:300;letter-spacing:.18em}.about dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:12.5px}.about dt{color:var(--dim)}.about dd{margin:0;font-family:var(--mono);word-break:break-all}
.view{flex:1;min-height:0;display:flex;background:#000}.view img{flex:1;min-width:0;width:100%;object-fit:contain}
iframe.app{flex:1;border:0;width:100%;background:#fff}
.note{font-size:12px;color:var(--tx2);background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.28);border-radius:8px;padding:8px 10px}
@media (max-width:700px){#tray .svc{display:none}#startb span{display:none}.files{grid-template-columns:1fr}.flist{border-right:0;border-bottom:1px solid var(--ln);max-height:40%}.set{grid-template-columns:1fr}}
</style></head><body>
<div id=wall class=cube></div>
<div id=desk role=grid aria-label="Desktop"></div>
<div id=ghost></div>
<div id=wins></div>
<div id=shield></div>
<div id=start role=dialog aria-label="Start">
 <div class=srch><svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.2 stroke-linecap=round><circle cx=10.5 cy=10.5 r=6.5 /><path d="M15.5 15.5 21 21"/></svg><input id=sq placeholder="Type to search apps…" autocomplete=off spellcheck=false></div>
 <h4 id=shd>All apps</h4>
 <div id=sapps></div>
 <div class=sfoot><div class=av>A</div><div class=who><b>__ASOLARIA_SEAT__</b><br><small>pid __ASOLARIA_PID__</small></div><span class=e0>E=0 · fire=0</span></div>
</div>
<div id=ctx class=menu></div>
<div id=toasts></div>
<div id=bar>
 <button id=startb title="Start — Win key, Alt+S, or just start typing on the desktop"></button>
 <div id=tasks></div>
 <div id=tray><div class=svc id=svcs title="Live system — click for System Monitor"></div><span class=e0 title="E=0: nothing launches except what you click or type">E=0</span><div id=clock><span id=ck1>--:--</span><small id=ck2>----</small></div></div>
</div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEAT='__ASOLARIA_SEAT__', PID='__ASOLARIA_PID__';
const store={get(k,d){try{const v=localStorage.getItem('asios.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('asios.'+k,JSON.stringify(v))}catch(e){}}};

/* ===================== wallpaper: the 3x3x3 cube, integer geometry ===================== */
function hero(){
 // isometric cube, half-width 156, half-height 90, edge 180; every face split into thirds (52/30/60 — all integers)
 const P=(x,y)=>`${x+200},${y+210}`, L=[];
 const face=(pts,c)=>`<polygon points="${pts.map(p=>P(p[0],p[1])).join(' ')}" fill="url(#${c})" stroke="rgba(220,235,255,.35)" stroke-width="1.2"/>`;
 for(let i=1;i<3;i++){ // grid lines on each face
  L.push([[-156+52*i,-90-30*i],[52*i,-30*i]],[[52*i,-180+30*i],[-156+52*i,-90+30*i]]); // top
  L.push([[-156,-90+60*i],[0,60*i]],[[-156+52*i,-90+30*i],[-156+52*i,90+30*i]]); // left
  L.push([[0,60*i],[156,-90+60*i]],[[52*i,-30*i],[52*i,180-30*i]]); // right
 }
 const lines=L.map(l=>`<line x1="${l[0][0]+200}" y1="${l[0][1]+210}" x2="${l[1][0]+200}" y2="${l[1][1]+210}"/>`).join('');
 let dots=''; for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){dots+=`<circle cx="${200+52*a-52*b}" cy="${120+30*a+30*b}" r="${a===0&&b===0?5:3}" fill="${a===0&&b===0?'#fff':'rgba(255,255,255,.75)'}"/>`;}
 return `<svg class=hero viewBox="0 0 400 430" aria-hidden=true><defs>
 <linearGradient id=ft x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="rgba(67,232,216,.55)"/><stop offset=1 stop-color="rgba(67,232,216,.18)"/></linearGradient>
 <linearGradient id=fl x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="rgba(167,139,250,.55)"/><stop offset=1 stop-color="rgba(167,139,250,.12)"/></linearGradient>
 <linearGradient id=fr x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="rgba(255,180,84,.5)"/><stop offset=1 stop-color="rgba(255,180,84,.1)"/></linearGradient>
 <radialGradient id=glow><stop offset=0 stop-color="rgba(120,170,255,.35)"/><stop offset=1 stop-color="rgba(120,170,255,0)"/></radialGradient></defs>
 <ellipse cx=200 cy=230 rx=200 ry=200 fill="url(#glow)"/>
 ${face([[0,-180],[156,-90],[0,0],[-156,-90]],'ft')}${face([[-156,-90],[0,0],[0,180],[-156,90]],'fl')}${face([[0,0],[156,-90],[156,90],[0,180]],'fr')}
 <g stroke="rgba(230,240,255,.28)" stroke-width="1">${lines}</g>${dots}</svg>`;
}

 const go=async()=>{const o=$('[data-o]',w.body); o.innerHTML='<span class=spin></span> reading…'; try{const t=await (await fetch('/api/kernel',{cache:'no-store'})).text(); o.innerHTML=rowsTable(t); $('[data-t]',w.body).textContent=new Date().toLocaleTimeString();}catch(e){o.innerHTML=`<div class=note>could not read: ${esc(e.message)}</div>`;}};
 $('[data-r]',w.body).onclick=go; go();
};
/* --- recall --- */
RUN.recall=w=>{
 w.body.innerHTML=`<div class=tool><input class=field style="flex:1" placeholder="Search your recall vault — e.g. BROWN-HILBERT" maxlength=128 spellcheck=false><button class="tbtn pri" data-go>Search</button></div><div class=pad data-o><div class=muted>Ask the local HILBRA inverted index (:4796). It returns <span class=mono>path · pid · bh · offset · length</span> rows. Large vaults can take several seconds.</div></div>`;
 const inp=$('input',w.body), o=$('[data-o]',w.body);
 const go=async()=>{const q=inp.value.trim(); if(!q) return; o.innerHTML=`<span class=spin></span> searching “${esc(q)}”… <span class=muted data-el></span>`; const t0=Date.now(); const tm=setInterval(()=>{const e=$('[data-el]',o); if(e) e.textContent=((Date.now()-t0)/1000|0)+' s';},500);
  try{const r=await fetch('/api/recall?q='+encodeURIComponent(q),{cache:'no-store'}); const t=await r.text(); clearInterval(tm); const ms=Date.now()-t0;
   const rows=t.trim().split('\n').filter(Boolean).map(hbp), head=rows.find(x=>x._tag==='HILBRASEARCH'), hits=rows.filter(x=>x._tag==='HILBRAMATCH'), down=rows.find(x=>x._tag==='RECALL');
   if(down){o.innerHTML=`<div class=note>${down.up==='0'?'Recall vault unreachable or timed out — results NOT measured (this is not “no results”).':'Query refused: '+esc(down.error||'')}<br><span class=mono>${esc(t.trim())}</span></div>`; return;}
   o.innerHTML=`<div class=muted style="margin-bottom:10px">${hits.length} shown${head?` of <b>${esc(head.candidate_count||'?')}</b> candidates · mode ${esc(head.mode||'')} · schema <span class=mono>${esc(head.index_schema||'')}</span>`:''} · ${ms} ms</div>`+(hits.length?hits.map(h=>`<div class=hit title="click to copy the path" data-p="${esc(h.path||'')}"><div class=pth>${esc(h.path||'?')}</div><div class=m><span class=kv>level=<b>${esc(h.level||'')}</b></span><span class=kv>pid=<b>${esc(h.pid||'')}</b></span><span class=kv>bh=<b>${esc(h.bh||'')}</b></span><span class=kv>off=<b>${esc(h.off||'')}</b></span><span class=kv>len=<b>${esc(h.len||'')}</b></span></div></div>`).join(''):`<div class=note>The vault answered with 0 matches for this term. count=0 is what the index returned for this spelling — not proof the content is absent.</div>`);
  }catch(e){clearInterval(tm); o.innerHTML=`<div class=note>request failed: ${esc(e.message)}</div>`;}};
 o.addEventListener('click',e=>{const h=e.target.closest('.hit'); if(!h) return; const t=h.dataset.p; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied',t),()=>toast('Path',t,6000));});
 $('[data-go]',w.body).onclick=go; inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();}); inp.focus(); w.onfocus=()=>setTimeout(()=>inp.focus(),0);
};
/* --- files --- */
const human=n=>{n=+n; if(n<1024) return n+' B'; if(n<1048576) return ((n/1024)|0)+' KB'; return ((n/1048576)|0)+' MB';};
RUN.files=w=>{
 w.body.innerHTML=`<div class=tool><button class=tbtn data-up title="Up one folder">↑</button><div class=crumb></div><button class=tbtn data-rf>Refresh</button></div><div class=files><div class=flist></div><div class=fview><span class=muted>Select a file to preview it. This browser is read-only and rooted at the backend office.</span></div></div>`;
 let cwd=store.get('files.cwd',''), sel=null;
 const list=$('.flist',w.body), view=$('.fview',w.body), crumb=$('.crumb',w.body);
 const go=async p=>{cwd=p; store.set('files.cwd',p); list.innerHTML='<div class=pad><span class=spin></span></div>';
  const parts=p?p.split('/'):[]; crumb.innerHTML=`<button data-p="">office</button>`+parts.map((s,i)=>`<span class=muted>›</span><button data-p="${esc(parts.slice(0,i+1).join('/'))}">${esc(s)}</button>`).join('');
  try{const r=await fetch('/fs/list?p='+encodeURIComponent(p),{cache:'no-store'}); const t=await r.text();
   if(!r.ok){ if(p){ go(''); return; } list.innerHTML=`<div class=pad><div class=note>${esc(r.status+' · '+t)}</div></div>`; return; }
   const rows=t.trim().split('\n').map(hbp), head=rows[0]||{}, ents=rows.filter(x=>x._tag==='FS').map(x=>({...x,name:decodeURIComponent(x.name||'')}));
   setSub(w,(head.entries||ents.length)+' items'+(head.truncated==='1'?' (first '+head.shown+')':''));
   list.innerHTML=ents.length?ents.map(x=>{const ext=x.name.split('.').pop().toLowerCase(); return `<div class=fent data-n="${esc(x.name)}" data-k=${x.kind}>${x.kind==='dir'?FICON.dir:(ext==='hbp'||ext==='hbi')?FICON.hbp:FICON.file}<span class=n>${esc(x.name)}</span><span class=z>${x.kind==='dir'?'':human(x.bytes)}</span></div>`;}).join(''):'<div class=pad><span class=muted>empty folder</span></div>';
  }catch(e){list.innerHTML=`<div class=pad><div class=note>${esc(e.message)}</div></div>`;}};
 const preview=async n=>{const p=(cwd?cwd+'/':'')+n; view.innerHTML='<span class=spin></span>'; try{const r=await fetch('/fs/read?p='+encodeURIComponent(p),{cache:'no-store'}); const t=await r.text();
  view.innerHTML=r.ok?`<div class=muted style="margin-bottom:8px">${esc(p)} · ${human(new Blob([t]).size)}</div>${esc(t)}`:`<div class=note>${esc(r.status===415?'Preview is for text files (.hbp .hbi .sha256 .md .txt .log .hex).':r.status===413?'File is over the 1 MiB preview limit.':r.status+' · '+t)}</div>`;}catch(e){view.textContent=e.message;}};
 list.addEventListener('click',e=>{const f=e.target.closest('.fent'); if(!f) return; $$('.fent',list).forEach(x=>x.classList.remove('sel')); f.classList.add('sel'); sel=f.dataset.n; if(f.dataset.k==='file') preview(sel);});
 list.addEventListener('dblclick',e=>{const f=e.target.closest('.fent'); if(f&&f.dataset.k==='dir') go((cwd?cwd+'/':'')+f.dataset.n);});
 crumb.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(b.dataset.p);});
 $('[data-up]',w.body).onclick=()=>go(cwd.split('/').slice(0,-1).join('/'));
 $('[data-rf]',w.body).onclick=()=>go(cwd);
 go(cwd);
};
/* --- dashboard, asi os screen, windows view --- */
RUN.dash=w=>{w.body.innerHTML=`<div class=tool><button class=tbtn data-r>Reload</button><button class=tbtn data-o>Open in browser tab</button><span class=muted>the backend office dashboard — a pixels-first render of the HBP/HBI rows</span></div><iframe class=app src="/dashboard" title=Dashboard></iframe>`;
 $('[data-r]',w.body).onclick=()=>{$('iframe',w.body).src='/dashboard?t='+Date.now();}; $('[data-o]',w.body).onclick=()=>window.open('/dashboard','_blank');};
RUN.asios=w=>{
 w.body.innerHTML=`<div class=tool><button class=tbtn data-r>Refresh</button><span class=muted>the bare-metal ASI OS kernel running in QEMU beside Windows — last screen + journal</span></div><div style="flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,32%)"><div class=view><img alt="ASI OS screen"></div><div class=pad style="border-top:1px solid var(--ln)" data-j></div></div>`;
 const go=async()=>{const img=$('img',w.body); img.src='/asios/screen.png?t='+Date.now(); img.onerror=()=>{img.alt='no screen yet: start the parallel VM (asios-parallel.sh start + shot)';};
  try{const r=await fetch('/asios/journal.hbp',{cache:'no-store'}); const t=await r.text(); $('[data-j]',w.body).innerHTML=r.ok?rowsTable(t.trim().split('\n').slice(-12).join('\n')):`<span class=muted>${esc(t)}</span>`;}catch(e){}};
 $('[data-r]',w.body).onclick=go; go();
};
RUN.winview=w=>{
 w.body.innerHTML=`<div class=tool><div class=seg><button class=on data-s=capture>Live capture</button><button data-s=projector>Projector</button></div><span class=muted data-st>connecting…</span><span style="flex:1"></span><button class=tbtn data-l title="Open Windows Sandbox or Explorer in its own window">Open Windows env</button></div><div class=view><img alt="Windows desktop (view-only)"></div><div class=tstat style="background:var(--winhd);padding:6px 12px"><span>view-only · this surface never sends input to Windows</span><span></span></div>`;
 let from='capture', url=null, on=true, tmr=null;
 const img=$('img',w.body), st=$('[data-st]',w.body);
 const loop=async()=>{ if(!on) return; if(w.min){tmr=setTimeout(loop,1000);return;}
  const wpx=Math.max(320,Math.min(1920,Math.round(img.clientWidth*(window.devicePixelRatio||1))));
  try{let label=''; if(from==='projector'){const s=await (await fetch('/win/state.hbp',{cache:'no-store'})).text(); const m=/status=([A-Z-]+)(?:\|age_s=(\d+))?/.exec(s); label=m?('projector '+m[1]+(m[2]!==undefined?' · '+m[2]+' s old':'')):'projector: no state';}
   const r=await fetch(from==='capture'?'/win/screen.bmp?w='+wpx:'/win/frame.jpg',{cache:'no-store'});
   if(r.ok){const u=URL.createObjectURL(await r.blob()); img.src=u; if(url) URL.revokeObjectURL(url); url=u; st.textContent=from==='capture'?('live capture · '+wpx+' px'):label;} else st.textContent=(label?label+' · ':'')+'no frame ('+r.status+')';
  }catch(e){st.textContent='no frame';}
  tmr=setTimeout(loop,from==='capture'?500:1200);};
 $('.seg',w.body).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; from=b.dataset.s; $$('.seg button',w.body).forEach(x=>x.classList.toggle('on',x===b));});
 $('[data-l]',w.body).onclick=async()=>{try{const t=await (await fetch('/win/launch',{method:'POST'})).text(); toast('Windows',t);}catch(e){toast('Windows','launch failed: '+e.message);}};
 w.cleanup.push(()=>{on=false; clearTimeout(tmr); if(url) URL.revokeObjectURL(url);}); loop();
};
/* --- settings --- */
const ACCENTS=[['#43e8d8','#a78bfa'],['#5b9bff','#7cf0ff'],['#ffb454','#ff6b9a'],['#5ce0a0','#43e8d8'],['#c084fc','#f472b6']];
function applySettings(){document.body.classList.toggle('light',store.get('theme','dark')==='light');
 document.body.style.setProperty('--ico',store.get('ico',56)+'px'); const a=ACCENTS[store.get('accent',0)]||ACCENTS[0];
 document.body.style.setProperty('--ac',a[0]); document.body.style.setProperty('--ac2',a[1]); applyWall();}
RUN.settings=w=>{
 const seg=(k,opts,cur)=>`<div class=seg data-k=${k}>${opts.map(([v,l])=>`<button data-v="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
 const draw=()=>{w.body.innerHTML=`<div class=pad><h3 style="margin:0 0 16px;font-weight:600">Personalize</h3><div class=set>
  <label>Theme</label>${seg('theme',[['dark','Dark'],['light','Light']],store.get('theme','dark'))}
  <label>Wallpaper</label>${seg('wall',[['cube','Cube'],['aurora','Aurora'],['dusk','Dusk'],['plain','Plain']],store.get('wall','cube'))}
  <label>Icon size</label>${seg('ico',[[44,'Small'],[56,'Medium'],[68,'Large']],store.get('ico',56))}
  <label>Accent</label><div data-k=accent>${ACCENTS.map((a,i)=>`<span class="swatch ${store.get('accent',0)===i?'on':''}" data-v=${i} style="background:linear-gradient(135deg,${a[0]},${a[1]})"></span>`).join('')}</div>
  <label>Clock seconds</label>${seg('secs',[['false','Off'],['true','On']],store.get('secs',false))}
  <label>Windows</label><div><button class=tbtn data-reset>Reset window positions</button></div></div>
  <p class=muted style="font-size:12px;margin-top:20px">Settings live in this browser (localStorage). They change pixels only — nothing on the system is started or written.</p></div>`;};
 draw();
 w.body.addEventListener('click',e=>{const b=e.target.closest('[data-v]'); const g=e.target.closest('[data-k]');
  if(e.target.closest('[data-reset]')){Object.keys(localStorage).filter(k=>k.startsWith('asios.geo.')).forEach(k=>localStorage.removeItem(k)); toast('Windows','saved positions cleared'); return;}
  if(!b||!g) return; let v=b.dataset.v; const k=g.dataset.k; if(k==='ico'||k==='accent') v=+v; if(k==='secs') v=v==='true';
  store.set(k,v); applySettings(); renderDesk(); tick(); draw();});
};
/* --- about --- */
RUN.about=w=>{
 const draw=()=>{const k=LIVE.rows.KERNEL||{}; w.body.innerHTML=`<div class=pad><div class=about>${logo(120).replace('<svg','<svg class=lg')}<div><h2>ASOLARIA ASI OS</h2><div class=muted>desktop shell · served by a pure Rust std front-end</div><dl>
 <dt>seat</dt><dd>${esc(SEAT)}</dd><dt>pid</dt><dd>${esc(PID)}</dd><dt>kernel</dt><dd>${esc(k.version||'—')}</dd><dt>anchor</dt><dd>${esc(k.anchor||'—')}</dd>
 <dt>front-end</dt><dd>Rust std · 0 external crates · loopback only</dd><dt>fire</dt><dd style="color:var(--gn)">E=0 · fire=0 — nothing launches except what you click or type</dd></dl></div></div></div>`;};
 liveSubs.add(draw); w.cleanup.push(()=>liveSubs.delete(draw)); draw();
};
/* ===================== boot ===================== */
applySettings(); renderDesk(); renderStart(); poll(); setInterval(poll,3000);
</script>
